<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Профіль потреб за Маслоу · Maslow needs profile</title>
<style>
:root{--bg:#f7f9fb;--fg:#14202b;--mut:#5a6672;--line:#d5dce3;--acc:#0f7b8a;--good:#2f8a4b;--low:#c2670a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161c;--fg:#e6ebf0;--mut:#9aa6b2;--line:#2c3640;--acc:#4cc2d3;--good:#6fcf8a;--low:#f0b24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--fg:#e6ebf0;--mut:#9aa6b2;--line:#2c3640;--acc:#4cc2d3;--good:#6fcf8a;--low:#f0b24a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 20px;font-size:15px}
button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{padding:10px 0;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;display:inline-block}
.dot.g{background:var(--good)}.dot.l{background:var(--low)}
.lb{flex:1}
.val{font:600 18px Georgia,serif;min-width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
svg{display:block;width:100%;height:auto;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 20px}
.st{border-top:2px solid var(--acc);padding-top:6px}
.st span{display:block;font-size:13px;color:var(--mut)}
.st b{font:600 17px/1.25 Georgia,serif;display:block;overflow-wrap:anywhere}
h2{font:600 19px Georgia,serif;margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
th{font:600 13px system-ui,sans-serif;color:var(--mut);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{width:2em;font:600 16px Georgia,serif}
td small{display:block;color:var(--mut);font-size:13px}
ul,ol{margin:8px 0 18px;padding-left:20px}
li{margin:0 0 6px}
.note{font-size:13px;color:var(--mut);margin:18px 0 0}
</style>
</head>
<body>
<main>
<header>
<div><h1 id="t"></h1></div>
<button id="lang" type="button"></button>
</header>
<p class="sub" id="sub"></p>
<section id="rows"></section>
<svg id="radar" viewBox="0 0 420 290" role="img"></svg>
<section class="stats">
<div class="st"><span id="k1"></span><b id="v1"></b></div>
<div class="st"><span id="k2"></span><b id="v2"></b></div>
<div class="st"><span id="k3"></span><b id="v3"></b></div>
</section>
<h2 id="ph"></h2>
<table><thead><tr><th>#</th><th id="th1"></th><th id="th2"></th></tr></thead><tbody id="plan"></tbody></table>
<ul id="cross"></ul>
<h2 id="wh"></h2>
<ol id="wk"></ol>
<button id="reset" type="button"></button>
<p class="note" id="note"></p>
</main>
<script>
var D={
uk:{t:"Профіль потреб за Маслоу",sub:"Рухай повзунки: діаграма, пріоритети й план підлаштовуються під твої оцінки. Дані зберігаються лише в твоєму браузері.",
full:["Сон, їжа, спорт","Приватність і безпека","Любов і приналежність","Повага","Самоактуалізація"],
short:["Фізіологія","Безпека","Приналежність","Повага","Самоактуалізація"],
k1:"Середнє",k2:"Найсильніший",k3:"Фокус зараз",ph:"Твій план за пріоритетом",th1:"Рівень",th2:"Наступний крок",
st:["слабке місце","тримається","опора"],wh:"План на 12 тижнів",reset:"Скинути до 5",lang:"English",
aria:"Радарна діаграма п’яти рівнів потреб",
w1:"Тижні 1–4: ",w2:"Тижні 5–8: ",w2b:"підтримуй усі рівні й повторюй щотижневі кроки.",w3:"Тижні 9–12: повторно оціни всі рівні та обери новий фокус.",
allgood:"Усі рівні стабільні: підтримуй їх і раз на місяць перевіряй оцінки.",
x1:"Сильна безпека — твоя опора, але перевір, чи вона не заважає відкритості з людьми: один безпечний крок самоодкриття на тиждень.",
x2:"Слабка приналежність часто тягне вниз повагу й самоактуалізацію, тому обирай проєкти й заняття, пов’язані зі спільнотою.",
note:"Це інструмент для самоспостереження, а не діагноз. Якщо поганий настрій триває понад два тижні, зверніться до фахівця.",
act:[["Почни з одного: фіксований час підйому, навіть у вихідні.","Додавай рух поступово: орієнтир ВООЗ — 150–300 хвилин на тиждень.","Тримай режим сну й руху, не ускладнюй його."],
["Зміцни базу: паролі, двофакторна автентифікація, налаштування приватності.","Раз на квартал перевіряй паролі й налаштування приватності.","Підтримуй, але стеж, щоб захист не заважав відкритості."],
["Один контакт на тиждень: напиши людині, з якою колись було добре.","Знайди місце зі щотижневою зустріччю: гурток, курс, волонтерство.","Бережи регулярність зустрічей і час від часу заглиблюй розмови."],
["Щовечора 3 рядки: що вдалося і що це каже про твої вміння.","Раз на місяць проси в однієї людини конкретний відгук.","Фіксуй досягнення й не знецінюй їх порівняннями."],
["Виділи 2 години на тиждень на невеликий проєкт, що має для тебе сенс.","Запиши 3 цінності й одну дію на тиждень для кожної.","Вибери складніший виклик, що розтягує твої навички."]]},
en:{t:"Maslow needs profile",sub:"Move the sliders: the chart, priorities and plan adapt to your scores. Your scores stay in your own browser only.",
full:["Sleep, food, sport","Privacy and safety","Love and belonging","Esteem","Self-actualization"],
short:["Physiology","Safety","Belonging","Esteem","Self-actualization"],
k1:"Average",k2:"Strongest",k3:"Focus now",ph:"Your plan by priority",th1:"Level",th2:"Next step",
st:["weak spot","holding","strong"],wh:"12-week plan",reset:"Reset to 5",lang:"Українська",
aria:"Radar chart of the five levels of needs",
w1:"Weeks 1–4: ",w2:"Weeks 5–8: ",w2b:"maintain all levels and repeat the weekly steps.",w3:"Weeks 9–12: re-score all levels and choose a new focus.",
allgood:"All levels look stable: maintain them and re-check your scores once a month.",
x1:"Strong safety is your anchor, but check that it doesn’t get in the way of openness with people: one safe step of self-disclosure a week.",
x2:"Weak belonging often drags down esteem and self-actualization, so choose projects and activities tied to a community.",
note:"This is a self-reflection tool, not a diagnosis. If a low mood lasts more than two weeks, please talk to a professional.",
act:[["Start with one thing: a fixed wake-up time, even on days off.","Add movement gradually: the WHO guideline is 150–300 minutes a week.","Keep your sleep and movement routine; don’t overcomplicate it."],
["Strengthen the base: passwords, two-factor authentication, privacy settings.","Once a quarter, review your passwords and privacy settings.","Maintain it, but make sure the guard doesn’t block openness."],
["One contact a week: message someone you once got along with.","Find a place with a weekly meeting: a club, a course, volunteering.","Protect the regular meetings and now and then go deeper in conversations."],
["Every evening, 3 lines: what worked and what it says about your skills.","Once a month, ask one person for specific feedback.","Record achievements and don’t discount them by comparing."],
["Set aside 2 hours a week for a small project that matters to you.","Write down 3 values and one action a week for each.","Pick a harder challenge that stretches your skills."]]}
};
var S={v:[5,5,5,5,5],l:((navigator.language||"en").slice(0,2)==="uk")?"uk":"en"};
try{var raw=localStorage.getItem("maslow-v1");if(raw){var p=JSON.parse(raw);
if(p&&Array.isArray(p.v)&&p.v.length===5){S.v=p.v.map(function(x){x=Math.round(+x);return(x>=1&&x<=10)?x:5})}
if(p&&(p.l==="uk"||p.l==="en")){S.l=p.l}}}catch(e){}
function save(){try{localStorage.setItem("maslow-v1",JSON.stringify(S))}catch(e){}}
var rows=document.getElementById("rows"),els=[];
for(var i=0;i<5;i++){(function(i){
var r=document.createElement("div");r.className="row";
var top=document.createElement("div");top.className="top";
var dot=document.createElement("span");dot.className="dot";
var lb=document.createElement("label");lb.className="lb";lb.htmlFor="s"+i;
var val=document.createElement("span");val.className="val";
top.appendChild(dot);top.appendChild(lb);top.appendChild(val);
var inp=document.createElement("input");inp.type="range";inp.min=1;inp.max=10;inp.step=1;inp.id="s"+i;inp.value=S.v[i];
inp.addEventListener("input",function(){S.v[i]=+inp.value;save();render()});
r.appendChild(top);r.appendChild(inp);rows.appendChild(r);
els.push({dot:dot,lb:lb,val:val,inp:inp});
})(i)}
function pt(i,v,R){var a=(-90+i*72)*Math.PI/180;return[210+R*v/10*Math.cos(a),150+R*v/10*Math.sin(a)]}
function f(n){return n.toFixed(1)}
function band(x){return x<=4?0:(x<=6?1:2)}
function dcls(x){return "dot"+(x>=7?" g":(x<=3?" l":""))}
function stat(x){return x>=7?2:(x<=3?0:1)}
function txt(id,s){document.getElementById(id).textContent=s}
function td(tr,cls){var c=document.createElement("td");if(cls)c.className=cls;tr.appendChild(c);return c}
function render(){
var d=D[S.l],v=S.v;
document.documentElement.lang=S.l;
txt("t",d.t);txt("sub",d.sub);txt("k1",d.k1);txt("k2",d.k2);txt("k3",d.k3);
txt("ph",d.ph);txt("th1",d.th1);txt("th2",d.th2);txt("wh",d.wh);
txt("reset",d.reset);txt("lang",d.lang);txt("note",d.note);
var mx=0,mn=0,sum=0;
for(var i=0;i<5;i++){
sum+=v[i];if(v[i]>v[mx])mx=i;if(v[i]<v[mn])mn=i;
els[i].lb.textContent=(i+1)+". "+d.full[i];
els[i].val.textContent=v[i];
els[i].inp.value=v[i];
els[i].dot.className=dcls(v[i]);
}
var avg=(sum/5).toFixed(1);if(S.l==="uk")avg=avg.replace(".",",");
txt("v1",avg+"/10");
txt("v2",d.short[mx]+" "+v[mx]);
txt("v3",d.short[mn]+" "+v[mn]);
var order=[0,1,2,3,4].sort(function(a,b){return v[a]-v[b]||a-b});
var tb=document.getElementById("plan");tb.innerHTML="";
order.forEach(function(i,k){
var tr=document.createElement("tr");
td(tr,"n").textContent=k+1;
var c=td(tr);
var dt=document.createElement("span");dt.className=dcls(v[i]);
var nm=document.createElement("b");nm.textContent=" "+d.short[i];
var sm=document.createElement("small");sm.textContent=v[i]+"/10 · "+d.st[stat(v[i])];
c.appendChild(dt);c.appendChild(nm);c.appendChild(sm);
td(tr).textContent=d.act[i][band(v[i])];
tb.appendChild(tr);
});
var cr=document.getElementById("cross");cr.innerHTML="";
function li(el,s){var x=document.createElement("li");x.textContent=s;el.appendChild(x)}
if(v[1]>=7&&v[2]<=4)li(cr,d.x1);
if(v[2]<=3&&(v[3]<=6||v[4]<=6))li(cr,d.x2);
var wk=document.getElementById("wk");wk.innerHTML="";
if(v[order[0]]>=7){li(wk,d.allgood)}else{
li(wk,d.w1+d.short[order[0]]+" ("+v[order[0]]+"/10)");
li(wk,d.w2+(v[order[1]]>=7?d.w2b:d.short[order[1]]+" ("+v[order[1]]+"/10)"));
li(wk,d.w3);}
var s="";
[2,4,6,8,10].forEach(function(g){var p=[];for(var i=0;i<5;i++)p.push(pt(i,g,90).map(f).join(","));
s+='<polygon points="'+p.join(" ")+'" style="fill:none;stroke:var(--line);stroke-width:1"/>'});
for(var i=0;i<5;i++){var e=pt(i,10,90);s+='<line x1="210" y1="150" x2="'+f(e[0])+'" y2="'+f(e[1])+'" style="stroke:var(--line);stroke-width:1"/>'}
var poly=[];for(var i=0;i<5;i++)poly.push(pt(i,v[i],90).map(f).join(","));
s+='<polygon points="'+poly.join(" ")+'" style="fill:var(--acc);fill-opacity:.22;stroke:var(--acc);stroke-width:2.5;stroke-linejoin:round"/>';
for(var i=0;i<5;i++){var q=pt(i,v[i],90),a=(-90+i*72)*Math.PI/180;
var col=v[i]>=7?"var(--good)":(v[i]<=3?"var(--low)":"var(--acc)");
s+='<circle cx="'+f(q[0])+'" cy="'+f(q[1])+'" r="5" style="fill:'+col+'"/>';
s+='<text x="'+f(q[0]+14*Math.cos(a))+'" y="'+f(q[1]+14*Math.sin(a)+5)+'" text-anchor="middle" style="fill:var(--fg);font:600 14px system-ui,sans-serif">'+v[i]+'</text>';
var l=pt(i,10,112),an=(i===0)?"middle":(i<3?"start":"end"),dy=(i===0)?-4:(i>=2&&i<=3?10:4);
s+='<text x="'+f(l[0])+'" y="'+f(l[1]+dy)+'" text-anchor="'+an+'" style="fill:var(--mut);font:14px system-ui,sans-serif">'+d.short[i]+'</text>';
}
var sv=document.getElementById("radar");sv.innerHTML=s;sv.setAttribute("aria-label",d.aria);
}
document.getElementById("lang").addEventListener("click",function(){S.l=(S.l==="uk")?"en":"uk";save();render()});
document.getElementById("reset").addEventListener("click",function(){S.v=[5,5,5,5,5];save();render()});
render();
</script>
</body>
</html>
