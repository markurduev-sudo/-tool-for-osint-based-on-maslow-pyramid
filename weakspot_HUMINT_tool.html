<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>weakspot:HUMINT tool</title>
<style>
:root{--bg:#f7f9fb;--fg:#14202b;--mut:#5a6672;--line:#d5dce3;--acc:#0f7b8a;--good:#2f8a4b;--low:#c2670a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10161c;--fg:#e6ebf0;--mut:#9aa6b2;--line:#2c3640;--acc:#4cc2d3;--good:#6fcf8a;--low:#f0b24a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161c;--fg:#e6ebf0;--mut:#9aa6b2;--line:#2c3640;--acc:#4cc2d3;--good:#6fcf8a;--low:#f0b24a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bar{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
h1{font:600 26px/1.2 Georgia,"Times New Roman",serif;margin:0;overflow-wrap:break-word}
.tag{font-size:13px;color:var(--mut);margin:2px 0 0}
.sub{color:var(--mut);margin:0 0 16px;font-size:15px}
button,select,input[type=text],textarea,.btn{font:inherit;font-size:16px;min-height:40px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px}
button{cursor:pointer}
button:hover,select:hover{border-color:var(--acc)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;margin:0 0 16px}
.seg button{flex:1;border-radius:0;border-right-width:0}
.seg button:first-child{border-radius:8px 0 0 8px}
.seg button:last-child{border-radius:0 8px 8px 0;border-right-width:1px}
[aria-pressed="true"]{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.warn,.lab{display:none}
.ana .warn{display:block;font-size:13px;color:var(--mut);border-left:3px solid var(--low);padding-left:10px;margin:0 0 12px}
.ana .lab{display:block;width:100%;margin:0 0 12px}
.row{padding:10px 0;border-top:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--acc);flex:none;display:inline-block}
.dot.g{background:var(--good)}.dot.l{background:var(--low)}
.lb{flex:1}
.val{font:600 18px Georgia,serif;min-width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--acc);margin:0}
details{margin:6px 0 0}
summary{cursor:pointer;font-size:13px;color:var(--mut)}
.it{margin:8px 0}.it p{margin:0 0 4px;font-size:14px}
.sc{display:flex;gap:4px}.sc button{flex:1;padding:4px 0;min-height:40px}
#cv3.fs{position:fixed;top:0;left:0;right:0;bottom:0;width:100vw;height:100vh;height:100dvh;z-index:50;margin:0;border:0;border-radius:0;background:var(--bg)}#cvx{position:fixed;top:12px;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:60;font-size:22px;line-height:1;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
#tb{position:fixed;bottom:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:60;display:flex;gap:6px;padding:8px 10px;border:1px solid var(--line);border-radius:18px;background:var(--bg)}#tb button{width:38px;height:38px;border-radius:10px;border:0;background:none;color:var(--fg);font-size:17px;padding:0}#tb button[aria-pressed=true]{background:rgba(124,92,255,.28)}
#qa{position:fixed;top:12px;top:calc(12px + env(safe-area-inset-top,0px));left:12px;z-index:60;display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}#qa input{width:150px}#pp{position:fixed;top:64px;right:12px;width:min(360px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;z-index:70;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}.pph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}.pph button{border:0;background:none;color:inherit;font-size:20px;padding:0 6px}#pp .lkr{flex-wrap:wrap}
.lk{display:none;margin-top:8px}.ana .lk{display:block}.lkr{display:flex;gap:8px}.lkr input{flex:1;min-width:0}.lks{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}.lks li{display:flex;align-items:center;gap:4px;border:1px solid rgba(128,128,128,.4);border-radius:12px;padding:2px 4px 2px 10px;max-width:100%}.lks a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lks button{border:0;background:none;color:inherit;cursor:pointer;padding:0 6px}.lkh{font-size:12px;opacity:.7;margin:4px 0 0}
.an{display:none;gap:8px;margin-top:8px}
.ana .an{display:flex;flex-wrap:wrap}
.an input{flex:1;min-width:140px}
svg{display:block;width:100%;height:auto;margin:16px 0 8px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0 20px}
@media (max-width:440px){.stats{grid-template-columns:1fr}h1{font-size:22px}header{flex-direction:column;gap:10px}.bar{justify-content:flex-start}.bar button{padding:6px 10px;font-size:14px}.bar{flex-wrap:nowrap}}
.st{border-top:2px solid var(--acc);padding-top:6px}
.st span{display:block;font-size:13px;color:var(--mut)}
.st b{font:600 17px/1.25 Georgia,serif;display:block;overflow-wrap:anywhere}
h2{font:600 19px Georgia,serif;margin:0 0 4px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 14px}
th{font:600 13px system-ui,sans-serif;color:var(--mut);text-align:left;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:9px 8px 9px 0;border-bottom:1px solid var(--line);vertical-align:top}
td.n{width:2em;font:600 16px Georgia,serif}
td small{display:block;color:var(--mut);font-size:13px}
ul,ol{margin:8px 0 18px;padding-left:20px}
li{margin:0 0 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--mut);margin:18px 0 0}

[hidden]{display:none!important}
textarea{width:100%;resize:vertical;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:60px}
.btn{display:inline-flex;align-items:center;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
.cc{display:grid;gap:8px;margin:0 0 14px}.cc input,.cc select{width:100%}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eb{width:100%;margin:0 0 12px;border-color:var(--low);color:var(--low)}
.cl{list-style:none;padding:0;margin:8px 0}
.cl li{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:0 0 8px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.cl li.cur{border-color:var(--acc)}
.cl li>span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}
.cl .mt{display:block;font-size:13px;color:var(--mut)}
.cl .bt{display:flex;gap:6px;flex:none}
.cl button{padding:4px 10px;min-height:36px}
.bd{font-size:12px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin-left:6px;color:var(--mut)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin:0 0 12px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;border:2px solid}
pre{font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--mut);margin:6px 0 16px}
#rep{display:none}
@media print{:root:root:root{--bg:#fff;--fg:#000;--mut:#444;--line:#bbb;--acc:#0f7b8a;--good:#2f8a4b;--low:#c2670a;color-scheme:light}
main>*:not(#rep){display:none!important}#rep{display:block}body{background:#fff}main{padding:0;max-width:none}
#rep table{width:100%;border-collapse:collapse}#rep th,#rep td{border:1px solid #bbb;padding:4px 6px;text-align:left;font-size:12px}}
#cv3{display:block;width:100%;height:440px;touch-action:none;border:1px solid var(--line);border-radius:8px;margin:12px 0 8px;cursor:grab}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
#logo{width:44px;height:44px;flex:none;border-radius:10px;background:#fff;padding:2px}
@media (max-width:440px){#logo{width:38px;height:38px}}
@media print{#rep .rl{height:56px;float:right;background:#fff}}

.hero{position:relative;overflow:hidden;border-radius:16px;min-height:400px;display:flex;align-items:flex-end;color:#fff;margin:0 0 18px;border:1px solid var(--line)}
